<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tinghe Zhang — 正在维护更新</title>
  <meta name="description" content="个人主页正在维护更新，敬请期待。">
  <meta name="robots" content="index, follow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fff8e8;
      --card: #fffdf7;
      --ink: #3d2a12;
      --muted: #8a7048;
      --accent: #f0b429;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      background:
        radial-gradient(720px 420px at 20% 0%, rgba(255, 214, 102, 0.45), transparent 60%),
        radial-gradient(640px 380px at 90% 100%, rgba(255, 176, 80, 0.28), transparent 55%),
        var(--bg);
      color: var(--ink);
      font-family: "Noto Sans SC", "Lato", sans-serif;
      text-align: center;
    }
    .card {
      width: min(520px, 100%);
    }
    .photo {
      width: min(280px, 72vw);
      height: auto;
      display: block;
      margin: 0 auto 22px;
      filter: drop-shadow(0 16px 28px rgba(180, 120, 20, 0.22));
    }
    h1 {
      margin: 0 0 10px;
      font-size: clamp(1.6rem, 4vw, 2rem);
      letter-spacing: 0.04em;
    }
    p {
      margin: 0;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.7;
    }
    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      margin: 0 3px;
      border-radius: 50%;
      background: var(--accent);
      animation: bounce 1.2s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.15s; }
    .dot:nth-child(3) { animation-delay: 0.3s; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      margin-top: 22px;
    }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.45; }
      40% { transform: translateY(-5px); opacity: 1; }
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="photo" src="images/nailong.png" alt="奶龙">
    <h1>正在维护更新</h1>
    <p><br>敬请期待。</p>
    <div class="status" aria-hidden="true">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </main>
</body>
</html>
